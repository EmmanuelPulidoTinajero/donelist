name: Terraform apply

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: infrastructure
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Create runner variables
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_INSTANCE_PROFILE_NAME: ${{ vars.INSTANCE_PROFILE_NAME }}
          TF_VAR_ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          REPOSITORY_BRANCH: ${{ github.ref_name }}
        run: |
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_VAR_INSTANCE_PROFILE_NAME"
          test -n "$TF_VAR_ALERT_EMAIL"
          cat > terraform.auto.tfvars.json <<EOF
          {"aws_region":"${{ vars.AWS_REGION || 'us-east-1' }}","repository_url":"${{ github.server_url }}/${{ github.repository }}.git","repository_branch":"$REPOSITORY_BRANCH","instance_profile_name":"$TF_VAR_INSTANCE_PROFILE_NAME","alert_email":"$TF_VAR_ALERT_EMAIL"}
          EOF
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=to-do-list-api/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform apply -auto-approve
      - name: Show the values to store as repository variables
        run: |
          echo "API_URL=$(terraform output -raw api_url)"
          echo "INSTANCE_ID=$(terraform output -raw instance_id)"
          echo "Both are printed above. Refresh API_URL in the repository variables after every apply that replaces the instance, or the 5-minute health check keeps polling a dead address."

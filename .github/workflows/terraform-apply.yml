name: Terraform apply

on:
  workflow_dispatch:
    inputs:
      tfvars_file:
        description: "Terraform variables file content is configured in the repository/environment"
        required: false
        type: string

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: infrastructure
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Create runner variables
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_AMI_ID: ${{ vars.AMI_ID }}
          TF_VAR_INSTANCE_PROFILE_NAME: ${{ vars.INSTANCE_PROFILE_NAME }}
          TF_VAR_SSH_KEY_NAME: ${{ vars.SSH_KEY_NAME }}
        run: |
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_VAR_AMI_ID"
          test -n "$TF_VAR_INSTANCE_PROFILE_NAME"
          test -n "$TF_VAR_SSH_KEY_NAME"
          cat > terraform.auto.tfvars.json <<EOF
          {"aws_region":"${{ vars.AWS_REGION || 'us-east-1' }}","repository_url":"${{ github.server_url }}/${{ github.repository }}.git","ami_id":"$TF_VAR_AMI_ID","instance_profile_name":"$TF_VAR_INSTANCE_PROFILE_NAME","ssh_key_name":"$TF_VAR_SSH_KEY_NAME"}
          EOF
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=to-do-list-api/terraform.tfstate" -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform apply -auto-approve

name: Health monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check API health
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          test -n "$API_URL"
          curl --fail --show-error --silent --retry 2 --retry-delay 5 "$API_URL/health"

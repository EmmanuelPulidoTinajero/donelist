name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  # Needed to request the deploy run: GITHUB_TOKEN events do not cascade.
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The release asset is the artifact the deploy workflow pushes to EC2.
      - name: Package the repository as a zip
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          zip_name="to-do-list-api-${RELEASE_TAG}.zip"
          git archive --format=zip --prefix="to-do-list-api-${RELEASE_TAG}/" -o "$zip_name" HEAD
          python3 - "$zip_name" <<'PY'
          import sys, zipfile

          required = ("requirements.txt", "src/main.py", "src/server.py", "db/schema.sql")
          archive = zipfile.ZipFile(sys.argv[1])
          names = archive.namelist()
          if archive.testzip() is not None:
              sys.exit("The release archive is corrupt")
          missing = [
              path for path in required
              if not any(name.endswith("/" + path) for name in names)
          ]
          if missing:
              sys.exit(f"The release archive is missing {', '.join(missing)}")
          print(f"{len(names)} entries in the release archive")
          PY

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: to-do-list-api-${{ github.ref_name }}.zip

      # GITHUB_TOKEN does not cascade: the release created above would never
      # enqueue deploy.yml, and nothing would report that the deploy was
      # skipped. workflow_dispatch is the one documented exception, so the
      # deploy is requested explicitly instead of waiting for the event.
      - name: Dispatch the deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh workflow run deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f release_tag="$RELEASE_TAG"
